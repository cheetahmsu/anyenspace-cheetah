<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LÀNG YÊN · Nhẹ nhàng</title>
<meta name="theme-color" content="#0b2a25">
<style>
/* Trang lite tạm: chỉ là đích đến của nút "Nhẹ nhàng", chưa có nội dung */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#174238 0%,#0b2a25 55%,#071c19 100%);color:#efe6cf;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:420px}
.brand{font-family:Georgia,serif;font-size:13px;letter-spacing:5px;color:#c8b07a;margin-bottom:28px}
.leaf{font-size:40px;line-height:1;margin-bottom:18px}
h1{font-family:Georgia,serif;font-weight:normal;font-size:30px;letter-spacing:2px;color:#f3e2b4;margin:0 0 14px}
p{font-size:16px;line-height:1.6;color:#d6d0bd;margin:0 0 30px}
a.back{display:inline-block;padding:11px 22px;border:1.5px solid #c8a96a88;border-radius:999px;color:#f3ead2;text-decoration:none;font-size:15px;background:#ffffff08}
a.back:hover,a.back:focus-visible{background:#c8a96a22}
</style>
</head>
<body>
<main>
<div class="brand">✧ LÀNG YÊN</div>
<div class="leaf" aria-hidden="true">🍃</div>
<h1>Nhẹ nhàng</h1>
<p>Làng Yên Lite đang được chuẩn bị.<br>Hít một hơi thật sâu, rồi quay lại sau nhé.</p>
<a class="back" href="../">← Về Làng Yên</a>
</main>
</body>
</html>
